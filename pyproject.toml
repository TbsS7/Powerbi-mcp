[project]
name = "powerbi-fullstack-mcp"
version = "0.1.0"
description = "Servidor MCP que une modelagem de dados (TOM/XMLA) e geração de visuais (PBIR) para Power BI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
modeling = [
    "pythonnet>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/server.py",
    "/errors.py",
    "/modeling",
    "/visuals",
    "/orchestrator",
]
exclude = [
    "/.venv*",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
